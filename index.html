<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Moon Chat</title>
<link rel="stylesheet" href="./style.css?v=6"><script src="./script.js?v=6" defer></script>
</head>
<body>
<canvas id="bg-canvas" aria-hidden="true"></canvas>
<main id="card-container" class="card-container"><section id="glass-card" class="glass-card">
  <div id="auth-section" class="form-step active auth-card">
    <div class="brand-mark">✦</div><p class="eyebrow">MOON CHAT</p><h1 id="auth-title">Welcome back</h1><p class="subtitle">A quiet place to connect.</p>
    <div class="toggle-container"><button id="toggle-login" class="toggle-btn active" type="button">Login</button><button id="toggle-signup" class="toggle-btn" type="button">Sign up</button></div>
    <form id="auth-form" novalidate><label class="field">Username<input id="username" autocomplete="username" required placeholder="Enter username"></label><label class="field">Password<input id="password" type="password" minlength="4" autocomplete="current-password" required placeholder="Enter password"></label><label id="birthdate-group" class="field hidden">Birthdate<input id="birthdate" type="date"></label><p id="form-status" class="form-status"></p><button id="submit-btn" class="action-btn" type="submit">Login</button></form>
  </div>
  <div id="customize-section" class="form-step auth-card"><p class="eyebrow">PROFILE</p><h1>Customize your profile</h1><p class="subtitle">Give your identity a little personality.</p><div class="profile-form"><label class="field">Profile picture URL<input id="profile-picture" type="url" placeholder="https://example.com/avatar.png"></label><label class="field">Username font<select id="font-family"><option value="Segoe UI, sans-serif">Modern</option><option value="Georgia, serif">Elegant</option><option value="Courier New, monospace">Retro</option><option value="Impact, sans-serif">Bold</option><option value="system-ui, sans-serif">Clean</option></select></label><label class="field">Username color<input id="font-color" type="color" value="#ffffff"></label><label class="check-row">Username glow<input id="glow-toggle" type="checkbox"></label></div><div class="preview-box"><small>PROFILE PREVIEW</small><img id="profile-preview-image" class="preview-avatar hidden" alt=""><strong id="username-preview">YourName</strong></div><button id="save-profile-btn" class="action-btn" type="button">Enter Moon Chat</button></div>
  <div id="chat-section" class="form-step chat-layout"><aside class="channel-sidebar"><div class="server-title">MOON CHAT <i></i></div><div class="channel-label">TEXT CHANNELS</div><nav id="channel-list"></nav><div class="account-card"><img id="user-avatar-image" class="avatar hidden" alt=""><span id="user-avatar" class="avatar">U</span><span><b id="sidebar-username">User</b><small id="sidebar-role">Member</small></span><button id="settings-btn" class="settings-btn" type="button" title="Settings">⚙</button></div></aside><section class="chat-main"><header class="chat-header"><div><strong id="room-title"># general</strong><small id="channel-topic">Welcome to Moon Chat</small></div><span id="user-role-badge">MEMBER</span></header><div id="message-container" aria-live="polite"></div><form id="chat-input-form"><input id="chat-msg" placeholder="Message # general" maxlength="500" required><button id="send-btn" type="submit">Send</button></form></section></div>
  <div id="settings-panel" class="settings-panel hidden" role="dialog" aria-modal="true"><div class="settings-header"><div><p class="eyebrow">ACCOUNT</p><h2>Settings</h2></div><button id="close-settings" class="close-btn" type="button">×</button></div><label class="field">Profile picture URL<input id="settings-picture" type="url" placeholder="https://example.com/avatar.png"></label><label class="field">Display name<input id="settings-display-name" type="text" maxlength="32"></label><label class="field">Message font<select id="settings-font"><option value="Segoe UI, sans-serif">Modern</option><option value="Georgia, serif">Elegant</option><option value="Courier New, monospace">Retro</option><option value="Impact, sans-serif">Bold</option></select></label><label class="field">Message color<input id="settings-color" type="color" value="#ffffff"></label><label class="check-row">Message glow<input id="settings-glow" type="checkbox"></label><button id="save-settings" class="action-btn" type="button">Save settings</button><p id="settings-status" class="form-status"></p></div>
</section></main>
</body></html>

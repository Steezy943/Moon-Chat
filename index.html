<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Moon Chat</title>
  <link rel="stylesheet" href="./style.css?v=moon-chat-3">
  <script src="./script.js?v=moon-chat-3" defer></script>
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <main class="card-container" id="card-container">
    <section class="glass-card" id="glass-card">
      <div id="auth-section" class="form-step active">
        <div class="brand-mark">✦</div><p class="eyebrow">MOON CHAT</p>
        <h1 id="auth-title">Welcome back</h1><p class="subtitle">A quiet place to connect.</p>
        <div id="toggle-container" class="toggle-container"><button type="button" id="toggle-login" class="toggle-btn active">Login</button><button type="button" id="toggle-signup" class="toggle-btn">Sign up</button></div>
        <form id="auth-form" novalidate>
          <div class="input-group"><label for="username">Username</label><input id="username" required autocomplete="username" placeholder="Enter username"></div>
          <div class="input-group"><label for="password">Password</label><input id="password" type="password" required minlength="4" autocomplete="current-password" placeholder="Enter password"></div>
          <div class="input-group hidden" id="birthdate-group"><label for="birthdate">Birthdate</label><input id="birthdate" type="date"></div>
          <p id="form-status" class="form-status"></p><button id="submit-btn" class="action-btn" type="submit">Login</button>
        </form>
      </div>
      <div id="customize-section" class="form-step"><p class="eyebrow">PROFILE</p><h1>Customize your profile</h1><p class="subtitle">Make your presence feel like home.</p><div class="form-scroll-container"><div class="input-group"><label for="font-family">Username font</label><select id="font-family"><option value="Segoe UI, sans-serif">Standard</option><option value="Courier New, monospace">Retro Space</option><option value="Georgia, serif">Elegant</option></select></div><div class="input-group"><label for="font-color">Username color</label><input id="font-color" type="color" value="#ffffff"></div><label class="toggle-inline"><span>Username text glow</span><input id="glow-toggle" type="checkbox"></label><div class="preview-box"><p>PREVIEW</p><span id="username-preview">YourName</span></div><button id="save-profile-btn" class="action-btn" type="button">Enter Moon Chat</button></div></div>
      <div id="chat-section" class="form-step chat-layout">
        <aside class="channel-sidebar"><div class="server-title"><span>MOON CHAT</span><span class="online-dot"></span></div><p class="channel-label">TEXT CHANNELS</p><div id="channel-list" class="channel-list"></div><p class="channel-label">ACCOUNT</p><div class="current-user"><span class="avatar" id="user-avatar">U</span><span><b id="sidebar-username">User</b><small id="sidebar-role">Member</small></span></div></aside>
        <section class="chat-main"><header class="chat-header"><div><strong id="room-title"># general</strong><small id="channel-topic">Welcome to Moon Chat</small></div><span id="user-role-badge">MEMBER</span></header><div id="message-container" aria-live="polite"></div><form id="chat-input-form"><input id="chat-msg" placeholder="Message # general" autocomplete="off" maxlength="500" required><button id="send-btn" type="submit">Send</button></form></section>
      </div>
    </section>
  </main>
</body>
</html>

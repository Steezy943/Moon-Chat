<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Chat Space</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <!-- Background Canvas for Interactive Particles -->
    <canvas id="bg-canvas"></canvas>

    <!-- 3D Glassmorphic Wrapper -->
    <div class="card-container" id="card-container">
        <div class="glass-card" id="glass-card">
            
            <!-- STEP 1: Auth (Login/Signup) Toggle -->
            <div id="auth-section" class="form-step active">
                <h2 id="auth-title">Welcome</h2>
                <div class="toggle-container">
                    <button id="toggle-login" class="toggle-btn active" onclick="switchAuthMode('login')">Login</button>
                    <button id="toggle-signup" class="toggle-btn" onclick="switchAuthMode('signup')">Sign Up</button>
                </div>

                <form id="auth-form">
                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Enter username" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter password" required>
                    </div>
                    <div class="input-group id-signup-only hidden">
                        <label for="birthdate">Birthdate</label>
                        <input type="date" id="birthdate">
                    </div>
                    
                    <button type="submit" id="submit-btn" class="action-btn">Next</button>
                </form>
            </div>

            <!-- STEP 2: Profile Customization -->
            <div id="customize-section" class="form-step">
                <h2>Customize Profile</h2>
                <div class="form-scroll-container">
                    <!-- Images -->
                    <div class="input-group">
                        <label for="avatar">Profile Picture (URL)</label>
                        <input type="text" id="avatar" placeholder="https://example.com">
                    </div>
                    <div class="input-group">
                        <label for="banner">Profile Banner (URL)</label>
                        <input type="text" id="banner" placeholder="https://example.com">
                    </div>

                    <!-- Typography & Styles -->
                    <div class="input-group">
                        <label for="font-family">Username Font</label>
                        <select id="font-family">
                            <option value="'Segoe UI', sans-serif">Standard</option>
                            <option value="'Courier New', monospace">Retro Space</option>
                            <option value="'Georgia', serif">Elegant</option>
                            <option value="'Impact', sans-serif">Bold Impact</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="font-color">Username Color</label>
                        <input type="color" id="font-color" value="#ffffff">
                    </div>

                    <div class="input-group toggle-inline">
                        <label for="glow-toggle">Username Text Glow</label>
                        <input type="checkbox" id="glow-toggle" class="switch">
                    </div>

                    <!-- Live Preview Box -->
                    <div class="preview-box">
                        <p>Username Preview:</p>
                        <span id="username-preview">YourName</span>
                    </div>

                    <button type="button" id="save-profile-btn" class="action-btn">Complete Setup</button>
                </div>
            </div>

            <!-- STEP 3: Main Room Layout Frame -->
            <div id="chat-section" class="form-step">
                <div class="chat-header">
                    <span id="room-title"># global-chat</span>
                    <span id="user-role-badge">Role: User</span>
                </div>
                
                <!-- Active Message Feed -->
                <div id="message-container"></div>
                
                <!-- Input Execution Strip -->
                <form id="chat-input-form">
                    <input type="text" id="chat-msg" placeholder="Type an unblocked message..." autocomplete="off" required>
                    <button type="submit" id="send-btn">Send</button>
                </form>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000">
<title>Moon Chat</title>
<link rel="stylesheet" href="./style.css?v=5">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:#fff}body{display:grid;place-items:center;overflow:hidden;background:#000}button,input,select{font:inherit}#bg-canvas{position:fixed;inset:0;width:100vw;height:100vh;background:#000;z-index:0;pointer-events:none}.card-container{position:relative;z-index:2;width:min(calc(100% - 24px),1080px);padding:12px}.glass-card{min-height:360px;padding:34px;border:1px solid #ffffff38;border-radius:24px;background:#14141ccc;color:#fff;box-shadow:0 30px 90px #000;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.form-step{display:none}.form-step.active{display:block}.hidden{display:none!important}.brand-mark{display:grid;place-items:center;width:40px;height:40px;margin:0 auto 12px;border:1px solid #ffffff55;border-radius:50%}.eyebrow{text-align:center;color:#aaa;font-size:10px;font-weight:bold;letter-spacing:3px}.subtitle{color:#aaa;margin:8px 0 20px}h1{text-align:center}.toggle-container{display:flex;gap:4px;padding:4px;margin:20px 0;border:1px solid #ffffff30;border-radius:11px;background:#000}.toggle-btn{flex:1;padding:11px;border:0;border-radius:8px;color:#aaa;background:transparent;cursor:pointer}.toggle-btn.active,.toggle-btn:hover{color:#fff;background:#ffffff22}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0;color:#aaa;font-size:11px;font-weight:bold;text-transform:uppercase}.field input,.field select{width:100%;padding:12px;border:1px solid #ffffff35;border-radius:9px;color:#fff;background:#000;outline:0}.action-btn{width:100%;padding:13px;border:0;border-radius:9px;color:#000;background:#fff;font-weight:bold;cursor:pointer}.form-status{min-height:18px;color:#ffaaa9;text-align:center;font-size:12px}.check-row{display:flex;justify-content:space-between;color:#aaa;margin:18px 0}.preview-box{display:flex;flex-direction:column;align-items:center;gap:8px;margin:18px 0;padding:18px;border:1px dashed #ffffff44;border-radius:10px}.preview-box strong{font-size:24px}.chat-layout{height:min(82vh,720px);grid-template-columns:220px minmax(0,1fr)}.chat-layout.active{display:grid}.channel-sidebar{padding:18px 12px;background:#08080eee;border-right:1px solid #ffffff18}.server-title{display:flex;justify-content:space-between;padding:4px 8px 20px;font-weight:bold;letter-spacing:1px}.server-title i{width:8px;height:8px;border-radius:50%;background:#54e88a}.channel-label{padding:10px 8px 6px;color:#777;font-size:10px;font-weight:bold}#channel-list{display:flex;flex-direction:column;gap:3px}.channel-btn{width:100%;padding:9px;border:0;border-radius:7px;text-align:left;color:#aaa;background:transparent;cursor:pointer}.channel-btn:hover,.channel-btn.active{color:#fff;background:#ffffff18}.account-card{display:flex;align-items:center;gap:9px;margin-top:20px;padding:10px;background:#ffffff12;border-radius:8px}.account-card small{display:block;color:#999;font-size:11px}.avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#000;background:#fff;font-weight:bold}.chat-main{min-width:0;display:flex;flex-direction:column}.chat-header{display:flex;justify-content:space-between;align-items:center;min-height:70px;padding:16px 22px;background:#0f0f16}.chat-header strong,.chat-header small{display:block}.chat-header small{color:#888}.chat-header>span{padding:5px 9px;border-radius:20px;background:#ffffff18;font-size:10px}#message-container{flex:1;min-height:0;overflow:auto;padding:22px;background:#000}.msg-block{margin-bottom:9px;padding:12px 14px;border:1px solid #ffffff18;border-radius:10px;background:#ffffff0d}.msg-head{display:flex;gap:10px}.msg-time{color:#777;font-size:11px}.msg-block p{margin:4px 0;color:#ddd}.mod-tools{display:flex;gap:5px;margin-top:8px}.mod-tools button{padding:4px 7px;border:1px solid #ff777755;border-radius:5px;color:#ffaaa8;background:#ff333315;cursor:pointer}.chat-main form{display:flex;gap:10px;padding:12px 16px;background:#0f0f16}.chat-main form input{flex:1;min-width:0;padding:13px;border:1px solid #ffffff25;border-radius:8px;color:#fff;background:#000;outline:0}.chat-main form button{padding:0 15px;border:0;color:#fff;background:transparent;font-weight:bold;cursor:pointer}@media(max-width:650px){.glass-card{padding:22px}.chat-layout{grid-template-columns:145px minmax(0,1fr)}}
</style>
<script src="./script.js?v=5" defer></script>
</head>
<body>
<canvas id="bg-canvas" aria-hidden="true"></canvas>
<main id="card-container" class="card-container"><section id="glass-card" class="glass-card">
<div id="auth-section" class="form-step active"><div class="brand-mark">✦</div><p class="eyebrow">MOON CHAT</p><h1 id="auth-title">Welcome back</h1><p class="subtitle">A quiet place to connect.</p><div class="toggle-container"><button id="toggle-login" class="toggle-btn active" type="button">Login</button><button id="toggle-signup" class="toggle-btn" type="button">Sign up</button></div><form id="auth-form" novalidate><label class="field">Username<input id="username" autocomplete="username" required></label><label class="field">Password<input id="password" type="password" minlength="4" autocomplete="current-password" required></label><label id="birthdate-group" class="field hidden">Birthdate<input id="birthdate" type="date"></label><p id="form-status" class="form-status"></p><button id="submit-btn" class="action-btn" type="submit">Login</button></form></div>
<div id="customize-section" class="form-step"><p class="eyebrow">PROFILE</p><h1>Customize your profile</h1><p class="subtitle">Make your presence feel like home.</p><label class="field">Username font<select id="font-family"><option>Segoe UI, sans-serif</option><option>Courier New, monospace</option><option>Georgia, serif</option></select></label><label class="field">Username color<input id="font-color" type="color" value="#ffffff"></label><label class="check-row">Username glow<input id="glow-toggle" type="checkbox"></label><div class="preview-box"><small>PREVIEW</small><strong id="username-preview">YourName</strong></div><button id="save-profile-btn" class="action-btn" type="button">Enter Moon Chat</button></div>
<div id="chat-section" class="form-step chat-layout"><aside class="channel-sidebar"><div class="server-title">MOON CHAT <i></i></div><div class="channel-label">TEXT CHANNELS</div><nav id="channel-list"></nav><div class="account-card"><span id="user-avatar" class="avatar">U</span><span><b id="sidebar-username">User</b><small id="sidebar-role">Member</small></span></div></aside><section class="chat-main"><header class="chat-header"><div><strong id="room-title"># general</strong><small id="channel-topic">Welcome to Moon Chat</small></div><span id="user-role-badge">MEMBER</span></header><div id="message-container" aria-live="polite"></div><form id="chat-input-form"><input id="chat-msg" placeholder="Message # general" maxlength="500" required><button id="send-btn" type="submit">Send</button></form></section></div>
</section></main>
</body></html>
